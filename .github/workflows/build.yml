name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - name: Build and run regression tests
        shell: pwsh
        run: ./support/Build.ps1
      - name: Package portable app
        shell: pwsh
        run: ./support/Package-Windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-tests
          path: |
            build/sync-fixture.json
            build/pair-v2-fixture.json
            build/qr-test.png
            build/qr-test.txt
            build/self-test-result.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*SHA256SUMS.txt
  mac:
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-tests
          path: fixtures
      - name: Build universal app
        run: zsh mac/Build.sh
      - name: Test cross-platform cryptography and storage
        run: mac/build/Kopra.app/Contents/MacOS/Kopra --self-test fixtures/sync-fixture.json
      - name: Package Mac app
        run: zsh mac/Package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-package
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*SHA256SUMS.txt
